name: CI

# Basic CI for the eq-platform pnpm monorepo (packages/eq-intake, eq-ai, eq-schemas,
# eq-validation, eq-confirm-ui, eq-format-ui, eq-intake-demo). This repo had no CI at
# all before this workflow — verified via the GitHub API (zero workflows configured).
#
# `pnpm ci:drift` (schema-generation drift check) — a prior local test flagged this as
# failing on a clean checkout (packageManager hash + em-dash noise). Re-verified from a
# genuinely fresh clone with the pinned pnpm version: zero diff, exit 0, reproducible
# twice in a row. The earlier finding was contaminated-environment noise, not a real
# bug — see PR discussion. Included below as a real gate.
#
# `pnpm test:integration` (eq-ai only, real Anthropic API) also runs unconditionally:
# the suite is self-skipping when ANTHROPIC_API_KEY is empty (see
# packages/eq-ai/test/anthropic.integration.test.ts — describe.skipIf(!HAS_KEY)), so it
# costs nothing today and starts asserting for real the moment the secret is added.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: eq-platform

jobs:
  build-test:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
        # No cache: 'pnpm' here. actions/setup-node's built-in pnpm cache computed its
        # store path (via `pnpm store path`) before `pnpm/action-setup` had finished
        # configuring PNPM_HOME, so it cached the wrong directory and the post-job save
        # step failed with a path-validation error (caught on a real CI run — every
        # actual build/typecheck/test step had already passed; only the cache-save
        # step failed). Caching is a speed optimisation, not a correctness requirement,
        # and getting the two actions' store-path resolution to agree isn't worth the
        # complexity for "basic" CI. Revisit with an explicit `actions/cache` step on
        # `~/.pnpm-store` if build times become a real problem.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      # Build MUST run before typecheck: eq-validation imports @eq/ai, and TypeScript
      # resolves that workspace dependency against its built dist/index.d.ts, not its
      # source. Verified on real CI (not just locally): typecheck-before-build failed
      # with "Cannot find module '@eq/ai'"; a from-scratch local repro (node_modules AND
      # every dist/ deleted, not just node_modules) reproduced it, confirming order is
      # the actual cause, not an environment fluke.
      - name: Build
        run: pnpm build

      - name: Typecheck + schema lint
        run: pnpm check

      - name: Schema drift check
        run: pnpm ci:drift

      - name: Test
        run: pnpm test

      - name: Integration test (real API, self-skips without a key)
        run: pnpm test:integration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  schema-sync:
    name: Canonical schema sync (root vs eq-platform)
    # Independent of build-test: root schemas/ isn't part of the eq-platform
    # pnpm workspace, and this check is a plain Node script with no deps, so
    # it doesn't need pnpm install or eq-platform's working-directory default.
    #
    # What this catches that pnpm ci:drift (in build-test, above) doesn't:
    # ci:drift only verifies eq-platform's own generated types/Zod are fresh
    # relative to eq-platform/packages/eq-schemas/src/schemas/. It never
    # compares that directory against root schemas/ — the two are separately
    # hand-authored and have drifted apart silently 4 times in the 6 days
    # before this check was added (see schemas/site.schema.json git log).
    #
    # Overrides the workflow-level `defaults.run.working-directory: eq-platform`
    # above back to repo root — build-test's default doesn't apply to this job
    # automatically, but job scope beats workflow scope, so it must be
    # overridden explicitly or `node scripts/check-schema-sync.mjs` below
    # resolves against eq-platform/scripts/, where the script doesn't exist.
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check schemas/ matches eq-platform's vendored copy
        run: node scripts/check-schema-sync.mjs
